# harness-check - clean Pack repository CI
#
# Pack repositories intentionally exclude self-development design docs, PLANs,
# .ut-tdd runtime state, and persisted DB files. This workflow therefore checks
# the distributable CLI/setup surface instead of source-repo governance gates
# that require docs/design or docs/plans.
# Do not replace test:pack with raw `vitest run`; full source-regression tests
# intentionally require source-only governance artifacts that Pack excludes.
name: harness-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: harness-check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  harness-check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: install deps (frozen)
        run: npm ci --no-audit --no-fund

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: pack smoke tests
        run: npm run test:pack

      - name: lint (biome)
        run: npm run lint

      # setup 投影と setup-smoke は Pack checkout の source CLI で検証する。
      # 生成 launcher (.ut-tdd/bin/ut-tdd.mjs) は sealed consumer runtime の activation pointer
      # だけを解決源とし、release materializer (#418 / #420) が runtime を封印・有効化するまでは
      # consumer_runtime_absent で fail-close する。本 CI は consumer runtime の実行可能性を検証しない
      # (それは #418 の clean 環境 smoke 受入の責務であり、完了まで release の promotion は不可)。
      - name: setup smoke (source CLI)
        run: |
          node src/cli.ts setup --solo
          node src/cli.ts doctor --setup-smoke

      - name: consumer launcher fail-close (runtime not activated)
        run: |
          test ! -e .ut-tdd/runtime/activation/active.json
          set +e
          node .ut-tdd/bin/ut-tdd.mjs doctor --setup-smoke >launcher.out 2>launcher.err
          code=$?
          set -e
          cat launcher.err
          test "$code" -eq 78
          test ! -s launcher.out
          test "$(cat launcher.err)" = "consumer_runtime_absent"
          test ! -e .ut-tdd/runtime/activation/active.json
